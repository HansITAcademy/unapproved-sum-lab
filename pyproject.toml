[project]
name = "unapproved-sum-lab"
version = "1.0.0"
description = "Clean computational laboratory for the Unapproved Sum / Compiled Authority study."
readme = "README.md"
authors = [
    { name = "Han Saem Kim" }
]
requires-python = ">=3.12"
dependencies = [
    "openai>=3.1.0,<4",
    "anthropic>=1.0.0,<2",
    "google-genai>=1.0.0,<2",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
